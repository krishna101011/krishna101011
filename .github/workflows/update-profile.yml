name: Update Control Room

on:
  workflow_dispatch:

  schedule:
    - cron: "17 18 * * *"

concurrency:
  group: control-room-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Collect GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/collect_github_data.py

      - name: Generate Control Room
        run: |
          python scripts/generate_panels.py

      - name: Show generated changes
        run: |
          git status --short

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+krishna101011@users.noreply.github.com"

          git add README.md data/ assets/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Update GitHub control room"

      - name: Push generated changes
        run: |
          git push