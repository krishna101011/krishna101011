name: Sync profile data

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # manual "run now" button in the Actions tab
  push:
    branches: [main]
  workflow_run:
    # GitHub suppresses push-triggered runs for commits made with the
    # default GITHUB_TOKEN, so pysnake.yml's own bot commit does NOT
    # cross-trigger this workflow via `push`. This does — it fires right
    # after pysnake.yml finishes, so the cache-bust query string for the
    # snake SVGs doesn't have to wait for the next 6h tick.
    workflows: ["Generate PySnake contribution animation"]
    types: [completed]

permissions:
  contents: write

jobs:
  update:
    # workflow_run fires on every conclusion (success, failure, cancelled) —
    # only actually run when the schedule/dispatch/push triggers fired, or
    # when pysnake.yml completed successfully.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so render_repl_block.py can look up each dist file's last-changed commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Update currently-building line
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py

      - name: Render language stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/langstats.py

      - name: Render REPL block
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_repl_block.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- README.md currently_building.txt dist/langstats-dark.svg dist/langstats-light.svg; then
            git add README.md currently_building.txt dist/langstats-dark.svg dist/langstats-light.svg
            git commit -m "chore: sync profile data [skip ci]"
            git push
          else
            echo "No change — skipping commit."
          fi
