<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Architecture diagram: the GitHub contribution calendar feeds pysnake.yml (fetch, engine, render, every 12 hours), which commits to main and, on completion, triggers update-readme.yml (every 6 hours otherwise) via a workflow_run event; both workflows commit to main."><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#306998"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFD43B"/></marker></defs><rect x="170" y="20" width="300" height="50" rx="4" fill="none" stroke="#306998" stroke-width="1.5"/><text x="320" y="42" text-anchor="middle" font-size="12" font-family="monospace, monospace" font-weight="bold" fill="#c9d1d9">GitHub contribution calendar</text><text x="320" y="57" text-anchor="middle" font-size="11" font-family="monospace, monospace" font-weight="normal" fill="#c9d1d9">(public page, no auth)</text><rect x="60" y="110" width="280" height="70" rx="4" fill="none" stroke="#306998" stroke-width="1.5"/><text x="200" y="142" text-anchor="middle" font-size="12" font-family="monospace, monospace" font-weight="bold" fill="#c9d1d9">pysnake.yml — every 12h</text><text x="200" y="157" text-anchor="middle" font-size="11" font-family="monospace, monospace" font-weight="normal" fill="#c9d1d9">fetch → engine → render</text><rect x="300" y="200" width="280" height="70" rx="4" fill="none" stroke="#306998" stroke-width="1.5"/><text x="440" y="232" text-anchor="middle" font-size="12" font-family="monospace, monospace" font-weight="bold" fill="#c9d1d9">update-readme.yml — every 6h</text><text x="440" y="247" text-anchor="middle" font-size="11" font-family="monospace, monospace" font-weight="normal" fill="#c9d1d9">update_readme → langstats → repl</text><rect x="170" y="290" width="300" height="50" rx="4" fill="none" stroke="#306998" stroke-width="1.5"/><text x="320" y="312" text-anchor="middle" font-size="12" font-family="monospace, monospace" font-weight="bold" fill="#c9d1d9">commit to main</text><text x="320" y="327" text-anchor="middle" font-size="11" font-family="monospace, monospace" font-weight="normal" fill="#c9d1d9">(github-actions[bot])</text><line x1="320" y1="70" x2="320" y2="108" stroke="#306998" stroke-width="1.5" marker-end="url(#arrow-blue)"/><line x1="200" y1="180" x2="200" y2="288" stroke="#306998" stroke-width="1.5" marker-end="url(#arrow-blue)"/><line x1="440" y1="270" x2="380" y2="288" stroke="#306998" stroke-width="1.5" marker-end="url(#arrow-blue)"/><line x1="300" y1="165" x2="340" y2="198" stroke="#FFD43B" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-yellow)"/><text x="365" y="190" text-anchor="middle" font-size="10" font-family="monospace, monospace" fill="#FFD43B">workflow_run: completed</text></svg>