<svg xmlns="http://www.w3.org/2000/svg" width="620" height="340" viewBox="0 0 620 340" role="img" aria-label="State diagram: EATING loops on normal days, moves to IDLE when the gap since the last contribution exceeds 10 days, moves to FED on a top 10% day, and both IDLE and FED return to EATING."><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#306998"/></marker><marker id="arrow-yellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFD43B"/></marker></defs><rect x="235" y="72" width="150" height="46" rx="6" fill="none" stroke="#306998" stroke-width="1.5"/><text x="310" y="99" text-anchor="middle" font-size="13" font-family="monospace, monospace" font-weight="bold" fill="#24292f">EATING</text><rect x="45" y="252" width="150" height="46" rx="6" fill="none" stroke="#306998" stroke-width="1.5"/><text x="120" y="279" text-anchor="middle" font-size="13" font-family="monospace, monospace" font-weight="bold" fill="#24292f">IDLE</text><rect x="425" y="252" width="150" height="46" rx="6" fill="none" stroke="#FFD43B" stroke-width="1.5"/><text x="500" y="279" text-anchor="middle" font-size="13" font-family="monospace, monospace" font-weight="bold" fill="#24292f">FED</text><path d="M288,72 C278,38 342,38 332,72" fill="none" stroke="#306998" stroke-width="1.5" marker-end="url(#arrow-blue)"/><text x="310" y="42" text-anchor="middle" font-size="10" font-family="monospace, monospace" fill="#24292f">normal day</text><path d="M250,118 Q229.8,213.6 140,252" fill="none" stroke="#306998" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M175,252 Q266.6,214.3 290,118" fill="none" stroke="#306998" stroke-width="1.5" marker-end="url(#arrow-blue)"/><path d="M370,118 Q390.2,213.6 480,252" fill="none" stroke="#FFD43B" stroke-width="1.5" marker-end="url(#arrow-yellow)"/><path d="M445,252 Q353.4,214.3 330,118" fill="none" stroke="#FFD43B" stroke-width="1.5" marker-end="url(#arrow-yellow)"/><text x="211" y="209" text-anchor="middle" font-size="10" font-family="monospace, monospace" fill="#24292f">gap &gt; 10 days</text><text x="216" y="224" text-anchor="middle" font-size="10" font-family="monospace, monospace" fill="#24292f">next contribution</text><text x="402" y="209" text-anchor="middle" font-size="10" font-family="monospace, monospace" fill="#24292f">top 10% day</text><text x="398" y="224" text-anchor="middle" font-size="10" font-family="monospace, monospace" fill="#24292f">next tick</text></svg>